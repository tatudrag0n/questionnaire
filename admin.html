<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>アンケート管理・集計</title><style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:24px;background:#f5f7fb;color:#17304a}input,select,button{font:inherit;padding:10px;margin:6px 0}input{width:min(95%,500px)}button{cursor:pointer}table{border-collapse:collapse;background:white}td,th{border:1px solid #cbd5e1;padding:8px;text-align:left}#table{overflow:auto}p{line-height:1.8}pre{white-space:pre-wrap}section{margin:24px 0}</style><h1>管理者用・回答集計</h1><p>管理トークンはCloudflareのシークレットADMIN_TOKENに設定してください。入力値は保存しません。共有端末では利用後にログアウトしてください。少人数区分や個別回答は公表しないでください。</p><form id="login"><label>管理トークン（32文字以上）<br><input id="token" type="password" autocomplete="off" required></label><button>回答を読み込む</button></form><p id="status" role="status"></p><main id="panel" hidden><button id="logout">ログアウト・読み込みデータを消す</button><button id="csv">全回答をCSVで保存</button><p>CSVは個別回答・順位・自由記述を含みます。非公開で管理してください。終了後もDBを削除しなければ読み出せます。</p><section><label>学年 <select id="grade"><option value="">すべて</option><option>1年</option><option>2年</option><option>3年</option></select></label> <label>試験種別 <select id="exam"><option value="">すべて</option></select></label><label> 試験名・実施月 <select id="examname"><option value="">すべて</option></select></label><label> 質問票の版 <select id="version"><option value="">すべて</option></select></label></section><section><label>集計する項目 <select id="metric"></select></label><label> 比較対象 <select id="mode"><option value="count">回答数の分布</option><option value="rank">学年順位帯とのクロス集計</option><option value="relative">順位÷対象人数の帯とのクロス集計</option></select></label><p>成績は任意の自己申告です。試験種別・実施月・学年をそろえて比較してください。結果は関連を示すもので、ICTが成績を変えた証明にはなりません。複数回答は各選択肢に計上します。未回答・順位情報が不足する回答は別枠で表示します。</p><p id="summary"></p><div id="table"></div></section></main><script type="module">
import{questions}from './survey.js';
const $=id=>document.getElementById(id);let rows=[];const metrics=[];
for(const q of questions){if(q.type==='text')continue;if(q.type==='matrix')q.rows.forEach((r,i)=>metrics.push({q,i,label:q.section+'：'+r}));else metrics.push({q,label:q.title});}
metrics.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.label;$('metric').append(o);});
function addOptions(id,values){$(id).replaceChildren(new Option('すべて',''));for(const v of [...new Set(values.filter(Boolean))].sort())$(id).add(new Option(v,v));}
$('login').onsubmit=async e=>{e.preventDefault();const button=$('login').querySelector('button');button.disabled=true;rows=[];$('panel').hidden=true;$('table').replaceChildren();const token=$('token').value;try{let cursor='';do{const r=await fetch('/api/admin/responses?cursor='+encodeURIComponent(cursor),{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得に失敗しました');rows.push(...d.rows);cursor=d.next||'';$('status').textContent=rows.length+'件読み込み中';}while(cursor);addOptions('exam',rows.map(r=>r.answers.exam));addOptions('examname',rows.map(r=>r.answers.examname));addOptions('version',rows.map(r=>r.version));$('token').value='';$('panel').hidden=false;$('status').textContent=rows.length+'件読み込み完了';render();}catch(e){rows=[];$('status').textContent=e.message;}finally{button.disabled=false;}};
function selected(){return rows.filter(r=>(!$('grade').value||r.answers.grade===$('grade').value)&&(!$('exam').value||r.answers.exam===$('exam').value)&&(!$('examname').value||r.answers.examname===$('examname').value)&&(!$('version').value||r.version===$('version').value));}
function band(a,mode){const rank=Number(a.rank);if(!Number.isInteger(rank)||rank<1)return '順位未回答';if(mode==='rank')return rank<=40?'1〜40位':rank<=80?'41〜80位':rank<=120?'81〜120位':rank<=160?'121〜160位':rank<=200?'161〜200位':'201位以降';const n=Number(a.cohort);if(!Number.isInteger(n)||n<rank)return '対象人数不足';const x=rank/n;return x<=.2?'順位/人数 ≤20%':x<=.4?'20%超〜40%':x<=.6?'40%超〜60%':x<=.8?'60%超〜80%':'80%超〜100%';}
function render(){const data=selected(),m=metrics[Number($('metric').value)],mode=$('mode').value;const cols=mode==='count'?['人数']:mode==='rank'?['1〜40位','41〜80位','81〜120位','121〜160位','161〜200位','201位以降','順位未回答']:['順位/人数 ≤20%','20%超〜40%','40%超〜60%','60%超〜80%','80%超〜100%','順位未回答','対象人数不足'];const labels=[...m.q.options,'未回答'];const counts=new Map(labels.map(x=>[x,Array(cols.length).fill(0)]));let answered=0;for(const r of data){let v=r.answers[m.q.id];if(m.i!==undefined)v=v?.[m.i];let values=Array.isArray(v)?v:v?[v]:[];if(values.length)answered++;else values=['未回答'];const col=mode==='count'?0:cols.indexOf(band(r.answers,mode));for(const x of values)if(counts.has(x)&&col>=0)counts.get(x)[col]++;}const t=document.createElement('table');function tr(values,header=false){const row=t.insertRow();for(const value of values){const cell=document.createElement(header?'th':'td');cell.textContent=value;row.append(cell);}}tr(['選択肢',...cols],true);for(const[l,c]of counts)tr([l,...c]);$('table').replaceChildren(t);$('summary').textContent=`対象 ${data.length}件／この項目への回答 ${answered}件。表は人数です。複数回答の合計は対象人数を超える場合があります。`;}
for(const id of ['grade','exam','examname','version','metric','mode'])$(id).onchange=render;
$('logout').onclick=()=>{rows=[];$('token').value='';$('panel').hidden=true;$('table').replaceChildren();$('status').textContent='読み込みデータを消しました。';};
$('csv').onclick=()=>{const fields=[...new Set(rows.flatMap(r=>Object.keys(r.answers)))];const headers=['id','version','created_at',...fields];const cell=v=>{let s=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const lines=[headers.map(cell).join(',')];for(const r of rows)lines.push([r.id,r.version,r.created_at,...fields.map(k=>r.answers[k])].map(cell).join(','));const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='survey-responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
